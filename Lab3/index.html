<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на кредит</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="loan-form">
      <h1>Заявка на кредит</h1>

      <fieldset>
        <h2>Личные данные</h2>
        <div class="fields">

          <div class="field">
            <label for="fullname">ФИО</label>
            <input type="text" placeholder="Иванов Иван Иванович">
          </div>

          <div class="field">
            <label for="birthdate">Дата рождения</label>
            <input type="date">
          </div>

          <div class="field">
            <label for="phone">Телефон</label>
            <input type="tel" placeholder="8 800 555-35-35">
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" placeholder="example@email.com">
          </div>

        </div>
      </fieldset>

    
    
      <fieldset>
        <h2>Параметры кредита</h2>
        <div class="fields">

          <div class="field">
            <label for="amount">Сумма кредита, ₽</label>
            <input type="number" placeholder="Например, 500000" min="50000" max="5000000" step="10000">
          </div>

          <div class="field">
            <label for="term">Срок кредита</label>
            <select>
              <option value="">- выберите срок -</option>
              <option value="6">6 месяцев</option>
              <option value="12">1 год</option>
              <option value="24">2 года</option>
              <option value="36">3 года</option>
              <option value="60">5 лет</option>
            </select>
          </div>

          <div class="field">
            <label for="purpose">Цель кредита</label>
            <input type="text" placeholder="Выберите или введите цель" list="purposeList">
            <datalist id="purposeList">
              <option value="Покупка автомобиля"></option>
              <option value="Ремонт квартиры"></option>
              <option value="Обучение"></option>
              <option value="Отдых"></option>
              <option value="Прочее"></option>
            </datalist>
          </div>

        </div>
      </fieldset>

      
      <fieldset>
        <h2>Тип занятости</h2>
        <div class="fields">

          <div class="option">
            <input type="radio" id="emp-full" name="employment" value="full" checked>
            <label for="emp-full">Полная занятость</label>
          </div>

          <div class="option">
            <input type="radio" id="emp-part" name="employment" value="part">
            <label for="emp-part">Частичная занятость</label>
          </div>

          <div class="option">
            <input type="radio" id="emp-self" name="employment" value="self">
            <label for="emp-self">Самозанятый / ИП</label>
          </div>

          <div class="option">
            <input type="radio" id="emp-none" name="employment" value="none">
            <label for="emp-none">Не работаю</label>
          </div>

        </div>
      </fieldset>

      
      <fieldset>
        <h2>Дополнительно</h2>
        <div class="fields">

          <div class="field">
            <label for="comment">Комментарий</label>
            <textarea rows="4" placeholder="Дополнительная информация (необязательно)"></textarea>
          </div>

          <div class="option">
            <input type="checkbox">
            <label for="consent">Согласен на обработку персональных данных</label>
          </div>

        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit">Отправить заявку</button>
      </div>

    </form>
</body>
</html>
